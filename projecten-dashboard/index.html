<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projecten</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--panel2:#f1f3f6;--line:#e3e6eb;--text:#1b1f27;--muted:#6b7280;
  --accent:#2f6f4f;--accent-soft:#e3f0e8;--red:#c2410c;--red-soft:#fdecdf;--amber:#a16207;--amber-soft:#fdf4d8;
  --blue:#1d4ed8;--blue-soft:#e3ebfd;--gray-soft:#eceef2;--shadow:0 1px 2px rgba(0,0,0,.05);--on-accent:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111418;--panel:#181c22;--panel2:#1f242b;--line:#2a3039;--text:#e6e9ee;--muted:#8b93a1;
  --accent:#5fbf8a;--accent-soft:#1d3327;--red:#f08a5d;--red-soft:#3a2219;--amber:#e0b54a;--amber-soft:#352c14;
  --blue:#7ea2ff;--blue-soft:#1c2540;--gray-soft:#252b33;--shadow:none;--on-accent:#0d1a12;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111418;--panel:#181c22;--panel2:#1f242b;--line:#2a3039;--text:#e6e9ee;--muted:#8b93a1;
  --accent:#5fbf8a;--accent-soft:#1d3327;--red:#f08a5d;--red-soft:#3a2219;--amber:#e0b54a;--amber-soft:#352c14;
  --blue:#7ea2ff;--blue-soft:#1c2540;--gray-soft:#252b33;--shadow:none;--on-accent:#0d1a12;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:220px 1fr;height:100%}
/* sidebar */
aside{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{font-weight:700;font-size:15px;padding:4px 8px 12px;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-block}
.navh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 8px 4px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--panel2)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav small{color:var(--muted);font-weight:400}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:12px}
.side-foot button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;text-align:left}
/* main */
main{overflow:auto;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top h1{font-size:18px;margin:0 12px 0 0}
#menu{display:none}
.search{flex:1;min-width:160px;max-width:340px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 10px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px}
.seg button.on{background:var(--panel2);font-weight:600}
select.f{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.danger-fill{background:var(--red);border-color:var(--red);color:var(--on-accent);font-weight:600}
.sync{font-size:12px;color:var(--muted);padding:6px 8px;display:flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--accent)}.sync.err i{background:var(--red)}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:40;padding:16px}
.modal>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:380px;width:100%}
.modal p{margin:0 0 14px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.content{padding:16px 20px 40px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{color:var(--muted);font-size:12px}
.stat.warn b{color:var(--red)}
/* focus strip */
.sec-h{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px}
.sec-h h2{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;align-items:start}
.col{background:var(--panel2);border-radius:10px;padding:8px;min-height:120px}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px;font-weight:600;font-size:13px}
.col-h small{color:var(--muted);font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:7px;box-shadow:var(--shadow);cursor:pointer}
.card:hover{border-color:var(--muted)}
.card.dragging{opacity:.4}
.card .t{font-weight:600;margin-bottom:4px;display:flex;gap:6px;align-items:flex-start}
.card .n{color:var(--muted);font-size:12px;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--gray-soft);color:var(--muted);white-space:nowrap}
.tag.cat{background:var(--blue-soft);color:var(--blue)}
.tag.late{background:var(--red-soft);color:var(--red)}
.tag.soon{background:var(--amber-soft);color:var(--amber)}
.prio{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
.p-hoog{background:var(--red)}.p-middel{background:var(--amber)}.p-laag{background:var(--muted)}
.bar{height:4px;background:var(--gray-soft);border-radius:4px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--accent)}
/* list */
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--panel2);cursor:pointer;user-select:none}
tr.row{cursor:pointer}tr.row:hover td{background:var(--panel2)}
td .mini{width:70px;display:inline-block;vertical-align:middle}
.st{font-size:12px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st-Idee{background:var(--gray-soft);color:var(--muted)}
.st-Gepland{background:var(--blue-soft);color:var(--blue)}
.st-Bezig{background:var(--accent-soft);color:var(--accent)}
.st-Wacht{background:var(--amber-soft);color:var(--amber)}
.st-Klaar{background:var(--panel2);color:var(--muted);text-decoration:line-through}
.empty{color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:10px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;z-index:20}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:21;transform:translateX(100%);transition:transform .18s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;gap:8px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh input{flex:1;font-size:17px;font-weight:700;border:0;background:none;outline:none}
.db{padding:14px 18px;overflow:auto;flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.fl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 4px}
.in{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 9px}
textarea.in{min-height:90px;resize:vertical}
.tasks{display:flex;flex-direction:column;gap:2px}
.task{display:flex;gap:8px;align-items:center;padding:3px 0}
.task input[type=text]{flex:1;border:0;background:none;padding:3px 0;outline:none}
.task.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.task .x{border:0;background:none;color:var(--muted);visibility:hidden}
.task:hover .x{visibility:visible}
.links a{display:inline-block;margin:2px 6px 2px 0;color:var(--blue);word-break:break-all}
.df{display:flex;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);gap:8px}
.danger{color:var(--red)}
.hint{color:var(--muted);font-size:12px}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
/* Claude-chats */
.n.wait{color:var(--red);-webkit-line-clamp:3}
.tag.wait{background:var(--red-soft);color:var(--red)}
.tag.chat{background:var(--accent-soft);color:var(--accent)}
.chats{display:flex;flex-direction:column;gap:6px}
.chat{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:start}
.chat b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.chat .acts{display:flex;gap:6px;align-items:center;grid-row:span 2}
.chat .acts a{color:var(--blue);font-size:12px;white-space:nowrap}
.chat .acts button{border:0;background:none;color:var(--muted)}
.chat .s{font-size:12px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.chat .s.w{color:var(--red)}
.inbox{display:flex;flex-direction:column;gap:8px}
.irow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.irow .txt{flex:1 1 260px;min-width:0}
.irow .txt b{display:block}
.irow .txt span{font-size:12px;color:var(--muted)}
.irow select{max-width:240px}
.sugg{font-size:12px;color:var(--accent)}
.banner{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.banner.err{border-color:var(--red);background:var(--red-soft)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:260px;z-index:25;transform:translateX(-100%);transition:transform .18s;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  aside.on{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.3)}
  #menu{display:inline-block!important}
  .stats{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:repeat(5,minmax(220px,80vw));overflow-x:auto}
  .content,.top{padding-left:16px;padding-right:16px}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><i></i>Projecten</div>
    <button class="nav on" data-cat="">Alle projecten <small id="c-all"></small></button>
    <div class="navh">Categorieën</div>
    <div id="cats"></div>
    <div class="navh">Snel</div>
    <button class="nav" data-quick="inbox" id="nav-inbox" hidden>📥 Nieuwe chats <small id="c-inbox"></small></button>
    <button class="nav" data-quick="wait" id="nav-wait" hidden>⏳ Claude wacht op jou <small id="c-wait"></small></button>
    <button class="nav" data-quick="focus">🔥 Focus (hoog + bezig) <small id="c-focus"></small></button>
    <button class="nav" data-quick="late">⏰ Deadline ≤ 7 dagen <small id="c-late"></small></button>
    <button class="nav" data-quick="stale">💤 Stilgevallen (&gt;14 d) <small id="c-stale"></small></button>
    <div class="side-foot">
      <span class="sync" id="sync"><i></i><span>Opgeslagen op dit apparaat</span></span>
      <span class="sync" id="chatsync" hidden><i></i><span></span></span>
      <button id="exp">⬇︎ Back-up opslaan</button>
      <button id="imp">⬆︎ Back-up terugzetten</button>
      <input type="file" id="file" accept=".json" hidden>
      <span class="hint" style="padding:6px 2px">Sneltoetsen: <kbd>N</kbd> nieuw · <kbd>/</kbd> zoek · <kbd>Esc</kbd> sluit</span>
    </div>
  </aside>
  <main>
    <div class="top">
      <button class="btn" id="menu" aria-label="Menu">☰</button>
      <h1 id="title">Alle projecten</h1>
      <input class="search" id="q" placeholder="Zoeken… ( / )">
      <div class="seg" id="views">
        <button data-v="board" class="on">Bord</button>
        <button data-v="list">Lijst</button>
      </div>
      <select class="f hide-m" id="fprio"><option value="">Alle prioriteiten</option><option>hoog</option><option>middel</option><option>laag</option></select>
      <label class="hint hide-m"><input type="checkbox" id="showdone"> Klaar tonen</label>
      <button class="btn primary" id="new">+ Nieuw project</button>
    </div>
    <div class="content">
      <div id="banner"></div>
      <div class="stats" id="stats"></div>
      <div id="view"></div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="dh"><input id="d-name" placeholder="Projectnaam"><button class="btn" id="d-close">✕</button></div>
  <div class="db">
    <div class="grid2">
      <div><label class="fl">Status</label><select class="in" id="d-status"></select></div>
      <div><label class="fl">Prioriteit</label><select class="in" id="d-prio"><option>hoog</option><option>middel</option><option>laag</option></select></div>
      <div><label class="fl">Categorie</label><input class="in" id="d-cat" list="catlist"><datalist id="catlist"></datalist></div>
      <div><label class="fl">Deadline</label><input class="in" type="date" id="d-due"></div>
    </div>
    <label class="fl">➡️ Volgende stap</label>
    <input class="in" id="d-next" placeholder="Wat is het eerstvolgende concrete ding?">
    <div id="d-chatbox" hidden>
      <label class="fl">💬 Claude-chats <span id="d-chatcount"></span></label>
      <div class="chats" id="d-chats"></div>
      <select class="in" id="d-addchat" style="margin-top:6px"></select>
    </div>
    <label class="fl">Taken <span id="d-prog"></span></label>
    <div class="tasks" id="d-tasks"></div>
    <input class="in" id="d-newtask" placeholder="+ Taak toevoegen (Enter)" style="margin-top:4px">
    <label class="fl">Links (één per regel: site, repo, map, document)</label>
    <textarea class="in" id="d-links" style="min-height:60px"></textarea>
    <div class="links" id="d-linkview"></div>
    <label class="fl">Notities</label>
    <textarea class="in" id="d-notes"></textarea>
    <p class="hint" id="d-dates"></p>
  </div>
  <div class="df"><button class="btn danger" id="d-del">Verwijderen</button><span class="hint" style="align-self:center">Wordt automatisch opgeslagen</span></div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" hidden><div><p id="m-text"></p><div class="row"><button class="btn" id="m-no">Annuleren</button><button class="btn danger-fill" id="m-yes">OK</button></div></div></div>

<script>
const STATUSES=["Idee","Gepland","Bezig","Wacht","Klaar"];
const KEY="projecten-dashboard-v1";
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,10);
const T=(t,d=false)=>({id:uid(),t,d});

function seed(){
  const now=today();
  const P=(name,cat,status,prio,next,tasks=[],notes="",links=[],due="")=>({id:uid(),name,cat,status,prio,next,tasks,notes,links,due,created:now,updated:now});
  return [
    P("Eva – persoonlijke AI-assistent","Eva & AI","Bezig","hoog","Geheugen kiezen: eerst CLAUDE.md, daarna pas claude-mem",
      [T("Skill toolkit-advies",true),T("Skill eva-voordoen",true),T("Skill vacatureplanning",true),T("Chrome DevTools MCP installeren"),T("Context7 MCP installeren"),T("Geheugen inrichten (CLAUDE.md)")],
      "Basis van alles: Claude Code + eigen skills. Regel: één systeem, geen tweede platform ernaast (dus geen Hermes Agent, Agents Office alleen als experiment).",
      ["https://github.com/Jaggylicious/Jaggylicious"]),
    P("Skill: eva-toolkit-advies","Eva & AI","Klaar","middel","Catalogus bijwerken bij elke nieuwe tool",
      [T("SKILL.md geschreven",true),T("Catalogus met tools",true),T("Hermes-plugins beoordeeld",true)],
      "Adviseert per project welke MCP's/skills passen en welke niet.",
      ["https://github.com/Jaggylicious/Jaggylicious/tree/main/skills/eva-toolkit-advies"]),
    P("Skill: eva-voordoen","Eva & AI","Bezig","middel","Eerste echte browsertaak samen voordoen en vastleggen",
      [T("SKILL.md geschreven",true),T("Chrome DevTools MCP werkend"),T("Eerste taak voordoen (bv. vacature overzetten)"),T("Taak 2× herhalen en checken")],
      "Eén keer voordoen, daarna herhalen. Stopknoppen vóór versturen/publiceren/betalen.",
      ["https://github.com/Jaggylicious/Jaggylicious/tree/main/skills/eva-voordoen"]),
    P("Skill: vacatureplanning","Eva & AI","Klaar","middel","Testen met volgende vacature-intake",
      [T("Skill gemaakt",true),T("Getest met echte intake (xlsx)")],
      "Zet tabblad 'Planning & processtappen' om naar agenda-herinneringen."),
    P("Eva spraak: Voicebox + 'Hé Eva'","Eva & AI","Idee","laag","Nederlandse stemkwaliteit van Voicebox testen",
      [T("Voicebox installeren en NL stem testen"),T("Spraakmemo's via Claude-app proberen"),T("Wake word lokaal (openWakeWord) – privacy-pauzeknop")],
      "Alleen lokaal. Microfoon luistert continu mee = privacyrisico bij gesprekken met kandidaten."),
    P("Eva eigen mailadres (365-postvak)","Eva & AI","Idee","laag","Apart Microsoft 365-postvak aanvragen",
      [T("Postvak aanmaken"),T("Koppelen via bestaande 365-connector")],"Niet via openmail of externe diensten."),
    P("Boom website: EN/TR + AI-zichtbaarheid","Boom Recruitment","Gepland","hoog","Engelse versie van de belangrijkste pagina's schrijven",
      [T("Engelse vertaling"),T("Turkse vertaling (optioneel)"),T("hreflang-tags"),T("schema.org"),T("llms.txt"),T("FAQ- en dienstteksten")],
      "Eigen werk, geen Weglot-abonnement nodig voor 1–2 talen. Snelheid en vindbaarheid vóór effecten."),
    P("Contentskill: vacature → LinkedIn/Instagram-post","Content & marketing","Gepland","hoog","Voorbeeldposts in Boom-toon verzamelen als basis",
      [T("5 goede voorbeeldposts verzamelen"),T("Skill schrijven"),T("Testen op 3 echte vacatures")],
      "Productie automatiseren, interactie (reageren/DM'en) niet."),
    P("Carrousel-builder in Boom-huisstijl","Content & marketing","Idee","middel","Huisstijl (kleuren, fonts) vastleggen",
      [T("Huisstijl vastleggen"),T("Sjabloon carrousel"),T("Skill bouwen")]),
    P("Contentcheck vóór publicatie","Content & marketing","Idee","laag","Checklist maken: hook, helderheid, huisstijl",[T("Checklist opstellen"),T("Als skill vastleggen")]),
    P("Vacature-reels met Remotion","Content & marketing","Idee","middel","Remotion-project starten (npx create-video@latest)",
      [T("Node.js installeren / checken"),T("Sjabloon: functie, locatie, 3 pluspunten"),T("Licentie Remotion checken")],
      "Huisstijl exact, geen kosten per video."),
    P("Boom Events – promo","Boom Events","Idee","laag","Bepalen welk event als eerste promo krijgt",
      [T("Event kiezen"),T("Reel of beelden (Remotion / Banana Pro)")]),
    P("Carbutler","Klantprojecten","Gepland","middel","Status bijwerken – security-scan vóór livegang",
      [T("Huidige status invullen"),T("Security-scan vóór livegang")],"Gevonden in catalogus: site met login/formulieren. Status nog controleren."),
    P("TTT","Klantprojecten","Gepland","middel","Status bijwerken – security-scan vóór livegang",

    P("Autoradam Lease","Klantprojecten","Gepland","middel","Status bijwerken – security-scan vóór livegang",

const chatUrl=id=>"https://claude.ai/code/"+encodeURIComponent(id);
const sTime=s=>Date.parse(s.updated_at||s.created_at||0)||0;

function extractSessions(payload){

function onSessions(list,storedAt){

  const prompt=`Je helpt een projectendashboard bijhouden. Hieronder staan bestaande projecten en nieuwe Claude-chats die nog niet gekoppeld zijn.

${JSON.stringify(projects)}

${JSON.stringify(chats)}`;

  const items=inbox();
  const opts=pid=>`<option value="">Koppelen aan…</option>${S.projects.filter(p=>p.status!=="Klaar").sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}"${pid===p.id?" selected":""}>${esc(p.name)}</option>`).join("")}<option value="__new">＋ Nieuw project van deze chat</option>`;
  const head=`<div class="banner"><span style="flex:1;min-width:200px">Chats die nog bij geen project horen. Kies een project, maak er een nieuw project van, of negeer losse vragen.${C.storedAt?` <span class="hint">Bijgewerkt ${esc(ago(C.storedAt))}.</span>`:""}</span>${C.sample?`<button class="btn primary" id="suggest"${C.busy?" disabled":""}>${C.busy?"Claude denkt na…":"✨ Laat Claude koppelen"}</button>`:""}${items.some(s=>C.sugg[s.id])?'<button class="btn" id="acceptall">Alle voorstellen overnemen</button>':""}</div>`;
  if(!C.on){$("#view").innerHTML='<div class="empty">Chats koppelen werkt in de gesynchroniseerde versie op claude.ai.</div>';return}
  if(!items.length){$("#view").innerHTML=head.replace(/<button class="btn" id="acceptall">.*?<\/button>/,"")+'<div class="empty">Alle chats zijn gekoppeld. Nieuwe chats verschijnen hier vanzelf.</div>';return}
  $("#view").innerHTML=head+`<div class="inbox">${items.map(s=>{const g=C.sugg[s.id]||{};const gp=g.pid&&S.projects.find(p=>p.id===g.pid);
    return `<div class="irow" data-sid="${esc(s.id)}"><div class="txt"><b>${esc(s.title)}</b><span>${esc(ago(sTime(s)))}${isBlocked(s)?" · ⏳ wacht op jou":""}${sSum(s)?" · "+esc(sSum(s)):""}</span>${gp?`<div class="sugg">✨ Voorstel: ${esc(gp.name)}</div>`:g.nieuw?`<div class="sugg">✨ Voorstel: nieuw project "${esc(g.nieuw)}"</div>`:g.los?'<div class="sugg">✨ Voorstel: losse vraag, negeren</div>':""}</div>
      <select class="f" data-act="assign">${opts(gp?gp.id:"")}</select>
      <a class="btn" href="${chatUrl(s.id)}" target="_blank" rel="noopener">Openen ↗</a>
      <button class="btn" data-act="ignore">Negeren</button></div>`}).join("")}</div>`;
}

/* drawer */
function openP(id){
  const p=S.projects.find(x=>x.id===id);if(!p)return;
  S.open=id;
  $("#d-name").value=p.name;
  $("#d-status").innerHTML=STATUSES.map(s=>`<option${s===p.status?" selected":""}>${s}</option>`).join("");
  $("#d-prio").value=p.prio;$("#d-cat").value=p.cat;$("#d-due").value=p.due||"";
  $("#d-next").value=p.next||"";$("#d-notes").value=p.notes||"";$("#d-links").value=(p.links||[]).join("\n");
  drawTasks(p);drawLinks(p);drawChats(p);
  $("#d-dates").textContent=`Aangemaakt ${p.created} · laatst bijgewerkt ${p.updated}`;
  $("#drawer").classList.add("on");$("#scrim").classList.add("on");
}
function drawChats(p){
  if(!p)return;$("#d-chatbox").hidden=!C.on;if(!C.on)return;
  const ch=chatsOf(p),missing=(p.sessions||[]).filter(id=>!C.byId[id]).length;
  $("#d-chatcount").textContent=ch.length?"· laatste activiteit "+ago(sTime(ch[0])):"";
  $("#d-chats").innerHTML=ch.map(s=>`<div class="chat" data-sid="${esc(s.id)}"><b>${esc(s.title)}</b><span class="acts"><a href="${chatUrl(s.id)}" target="_blank" rel="noopener">Openen ↗</a><button data-act="unlink" title="Ontkoppelen" aria-label="Ontkoppelen">✕</button></span>
    <span class="s${isBlocked(s)?" w":""}">${isBlocked(s)?"⏳ Wacht op jou: ":isWorking(s)?"● Bezig · ":""}${esc(sSum(s)||"Geen samenvatting")} · ${esc(ago(sTime(s)))}</span></div>`).join("")
    +(missing?`<span class="hint">${missing} gekoppelde chat${missing>1?"s":""} niet (meer) gevonden.</span>`:"")
    +(ch.length||missing?"":'<span class="hint">Nog geen chats gekoppeld.</span>');
  const linked=linkedIds();
  const free=C.list.filter(s=>!isArchived(s)&&!linked.has(s.id)).sort((a,b)=>sTime(b)-sTime(a));
  $("#d-addchat").innerHTML=`<option value="">＋ Chat koppelen…</option>`+free.map(s=>`<option value="${esc(s.id)}">${esc(s.title)} · ${esc(ago(sTime(s)))}</option>`).join("");
}
function closeP(){S.open=null;$("#drawer").classList.remove("on");$("#scrim").classList.remove("on");render()}
const cur=()=>S.projects.find(x=>x.id===S.open);
function touch(p){p.updated=today();persist(p);$("#d-dates").textContent=`Aangemaakt ${p.created} · laatst bijgewerkt ${p.updated}`}
function drawTasks(p){
  $("#d-prog").textContent=p.tasks.length?`· ${p.tasks.filter(t=>t.d).length}/${p.tasks.length}`:"";
  $("#d-tasks").innerHTML=p.tasks.map(t=>`<div class="task${t.d?" done":""}" data-tid="${t.id}"><input type="checkbox"${t.d?" checked":""}><input type="text" value="${esc(t.t)}"><button class="x" title="Verwijder">✕</button></div>`).join("");
}
function drawLinks(p){
  $("#d-linkview").innerHTML=(p.links||[]).map(l=>{const href=/^[a-z]+:\/\//i.test(l)?l:"https://"+l;return `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(l.replace(/^https?:\/\//,""))}</a>`}).join("");
}
function bind(id,field,fn){$(id).addEventListener("input",e=>{const p=cur();if(!p)return;p[field]=fn?fn(e.target.value):e.target.value;touch(p);if(field==="links")drawLinks(p)})}
bind("#d-name","name");bind("#d-cat","cat",v=>v.trim()||"Overig");bind("#d-due","due");bind("#d-next","next");bind("#d-notes","notes");
bind("#d-links","links",v=>v.split("\n").map(s=>s.trim()).filter(Boolean));
$("#d-status").addEventListener("change",e=>{const p=cur();p.status=e.target.value;touch(p)});
$("#d-prio").addEventListener("change",e=>{const p=cur();p.prio=e.target.value;touch(p)});
$("#d-newtask").addEventListener("keydown",e=>{if(e.key!=="Enter"||!e.target.value.trim())return;const p=cur();p.tasks.push(T(e.target.value.trim()));e.target.value="";touch(p);drawTasks(p)});
$("#d-tasks").addEventListener("change",e=>{const p=cur(),row=e.target.closest(".task"),t=p.tasks.find(x=>x.id===row.dataset.tid);if(e.target.type==="checkbox"){t.d=e.target.checked;touch(p);drawTasks(p)}});
$("#d-tasks").addEventListener("input",e=>{if(e.target.type!=="text")return;const p=cur(),t=p.tasks.find(x=>x.id===e.target.closest(".task").dataset.tid);t.t=e.target.value;touch(p)});
$("#d-tasks").addEventListener("click",e=>{if(!e.target.classList.contains("x"))return;const p=cur();p.tasks=p.tasks.filter(x=>x.id!==e.target.closest(".task").dataset.tid);touch(p);drawTasks(p)});
$("#d-addchat").addEventListener("change",e=>{const p=cur();if(!p||!e.target.value)return;linkChat(p.id,e.target.value);drawChats(p);render();toast("Chat gekoppeld")});
$("#d-chats").addEventListener("click",e=>{const b=e.target.closest("[data-act=unlink]");if(!b)return;const p=cur();unlinkChat(p.id,b.closest(".chat").dataset.sid);drawChats(p);render()});
$("#view").addEventListener("change",e=>{
  const sel=e.target.closest("[data-act=assign]");if(!sel||!sel.value)return;const sid=sel.closest(".irow").dataset.sid;
  if(sel.value==="__new"){const p=newFromChat(sid);render();openP(p.id);toast("Nieuw project gemaakt")}else{linkChat(sel.value,sid);render();toast("Gekoppeld")}
});
$("#view").addEventListener("click",e=>{
  const ig=e.target.closest("[data-act=ignore]");
  if(ig){const sid=ig.closest(".irow").dataset.sid;C.ignored=[...new Set([...C.ignored,sid])];delete C.sugg[sid];persistIgnored();render();return}
  if(e.target.closest("#suggest")){suggest(true);return}
  if(e.target.closest("#acceptall")){let n=0;inbox().forEach(s=>{const g=C.sugg[s.id];if(!g)return;n++;if(g.pid)linkChat(g.pid,s.id);else if(g.nieuw)newFromChat(s.id,g.nieuw);else if(g.los){C.ignored.push(s.id)}});persistIgnored();render();toast(n+" voorstellen overgenomen");return}
});
$("#banner").addEventListener("click",e=>{if(e.target.closest("#grant"))grantChats()});
$("#d-close").onclick=closeP;$("#scrim").onclick=closeP;
$("#d-del").onclick=async()=>{const p=cur();if(!p)return;if(await ask(`"${p.name||"Naamloos project"}" verwijderen? Dit kan niet ongedaan worden gemaakt.`,"Verwijderen")){S.projects=S.projects.filter(x=>x.id!==p.id);save();removeRemote(p.id);closeP();toast("Verwijderd")}};

function newP(){
  const p={id:uid(),name:"",cat:S.cat||"Overig",status:"Idee",prio:"middel",next:"",tasks:[],notes:"",links:[],sessions:[],due:"",created:today(),updated:today()};
  S.projects.unshift(p);persist(p);render();openP(p.id);setTimeout(()=>$("#d-name").focus(),50);
}

/* events */
document.addEventListener("click",e=>{
  const c=e.target.closest(".card,tr.row");if(c){openP(c.dataset.id);return}
  const n=e.target.closest(".nav");
  if(n){if(n.dataset.quick){S.quick=S.quick===n.dataset.quick?"":n.dataset.quick;S.cat=""}else{S.cat=n.dataset.cat||"";S.quick=""}render();return}
  const st=e.target.closest(".stat");if(st){S.quick=st.dataset.q;S.cat="";render();return}
  const th=e.target.closest("th[data-sort]");if(th){S.sort=th.dataset.sort;render();return}
  const v=e.target.closest("#views button");if(v){S.view=v.dataset.v;save();render()}
});
$("#menu").onclick=e=>{e.stopPropagation();$("#side").classList.toggle("on")};
document.addEventListener("click",e=>{if(!e.target.closest("#side")||e.target.closest(".nav"))$("#side").classList.remove("on")},true);
$("#q").addEventListener("input",e=>{S.q=e.target.value;render()});
$("#fprio").addEventListener("change",e=>{S.prio=e.target.value;render()});
$("#showdone").addEventListener("change",e=>{S.showDone=e.target.checked;render()});
$("#new").onclick=newP;
document.addEventListener("keydown",e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(!$("#modal").hidden){if(e.key==="Escape")$("#m-no").click();return}
  if(e.key==="Escape"){if(S.open)closeP();else if(typing)document.activeElement.blur();return}
  if(typing)return;
  if(e.key==="/"){e.preventDefault();$("#q").focus()}
  if(e.key.toLowerCase()==="n"){e.preventDefault();newP()}
});
/* drag & drop */
document.addEventListener("dragstart",e=>{const c=e.target.closest(".card");if(!c)return;e.dataTransfer.setData("text/plain",c.dataset.id);c.classList.add("dragging")});
document.addEventListener("dragend",e=>{const c=e.target.closest(".card");if(c)c.classList.remove("dragging")});
document.addEventListener("dragover",e=>{const col=e.target.closest(".col");if(!col)return;e.preventDefault();document.querySelectorAll(".col.drop").forEach(x=>x!==col&&x.classList.remove("drop"));col.classList.add("drop")});
document.addEventListener("drop",e=>{const col=e.target.closest(".col");document.querySelectorAll(".col.drop").forEach(x=>x.classList.remove("drop"));if(!col)return;e.preventDefault();const p=S.projects.find(x=>x.id===e.dataTransfer.getData("text/plain"));if(p&&p.status!==col.dataset.status){p.status=col.dataset.status;p.updated=today();persist(p);render();toast(`→ ${p.status}`)}});
/* backup */
$("#exp").onclick=async()=>{
  const json=JSON.stringify({projects:S.projects},null,2),name=`projecten-backup-${today()}.json`;
  if(ONLINE){
    if(!DL){toast("Downloaden kan hier niet – gebruik de app op je computer");return}
    try{await DL.save({filename:name,data:json});toast("Back-up opgeslagen")}catch(e){toast(e&&e.code==="declined"?"Geannuleerd":"Back-up opslaan mislukt")}
    return;
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;a.click();toast("Back-up opgeslagen");
};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;f.text().then(async t=>{
  let d;try{d=JSON.parse(t);if(!Array.isArray(d.projects))throw 0}catch(_){toast("Dit is geen geldig back-upbestand");return}
  if(!await ask(`${d.projects.length} projecten terugzetten? De huidige lijst wordt vervangen.`,"Terugzetten"))return;
  const old=S.projects.map(p=>p.id);
  S.projects=d.projects.map(p=>({id:p.id||uid(),name:"",cat:"Overig",status:"Idee",prio:"middel",next:"",tasks:[],notes:"",links:[],due:"",created:today(),updated:today(),...p}));
  old.filter(id=>!S.projects.find(p=>p.id===id)).forEach(removeRemote);
  S.projects.forEach(persist);render();toast("Teruggezet");
})};

load();render();connect();connectChats();
</script>
</body>
</html>
